name: Publicar en Instagram

# Se puede lanzar de dos formas:
# 1) Manual: entrás a la pestaña "Actions" del repo en GitHub, elegís este workflow
#    y le das "Run workflow" -> publica el próximo posteo de la cola ya mismo.
# 2) Automática: corre sola según el horario de abajo (cron, en UTC).
on:
  workflow_dispatch:
  schedule:
    # Lunes, miércoles y viernes a las 15:00 UTC (12:00 hora de Argentina)
    - cron: "0 15 * * 1,3,5"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Publicar próximo posteo en cola
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python3 scripts/publish_post.py

      - name: Guardar cambios (mover posteo publicado)
        run: |
          git config user.name "Flow Systems Bot"
          git config user.email "bot@somosflowsystems.com"
          git add instagram-posts/
          git diff --cached --quiet || git commit -m "Publicado posteo automático"
          git push
